name: Release

# Push a tag like `v0.2.0` to publish a GitHub release. The annotated tag message becomes the
# release notes (falls back to the commit list since the previous tag). Keep Markdown headings with:
#   git tag -a v0.2.0 --cleanup=verbatim -F notes.md && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify tag matches plugin.json version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version plugin/plugin.json)
          if [ "$manifest" != "$ver" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin/plugin.json version ${manifest}"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build release archives
        env:
          CGO_ENABLED: "0"
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="agy-ptc_${ver}_${os}_${arch}"
            stage="build/${name}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            mkdir -p "$stage"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "${stage}/agy-ptc${ext}" ./cmd/agy-ptc
            # `agy-ptc install` looks for plugin/ next to the binary.
            cp -r plugin "${stage}/plugin"
            cp README.md README_ZH.md LICENSE "${stage}/"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -qr "../../dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" .
            fi
          done
          "./build/agy-ptc_${ver}_linux_amd64/agy-ptc" version | grep -q "v${ver} " || { echo "binary reports a different version"; exit 1; }
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist/

      - name: Write release notes
        run: |
          git fetch --force --tags
          ver="${GITHUB_REF_NAME#v}"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then # annotated tag: its message is the notes
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          fi
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
              echo "$notes"
            else
              echo "## Changes"
              if [ -n "$prev" ]; then git log --format='- %s' "${prev}..${GITHUB_REF_NAME}"; else git log --format='- %s' "$GITHUB_REF_NAME"; fi
            fi
            echo
            echo "---"
            echo
            echo "### Install / 安装"
            echo
            echo '```bash'
            echo "# macOS / Linux"
            echo "mkdir -p agy-ptc && tar -xzf agy-ptc_${ver}_<os>_<arch>.tar.gz -C agy-ptc && ./agy-ptc/agy-ptc install"
            echo
            echo "# Windows (PowerShell)"
            echo "Expand-Archive agy-ptc_${ver}_windows_amd64.zip -DestinationPath agy-ptc; .\\agy-ptc\\agy-ptc.exe install"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
